services:

  # ── Vector Database ───────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.25.1
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: ./visual-discovery-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - WEAVIATE_HOST=weaviate
      - WEAVIATE_PORT=8080
      - WEAVIATE_URL=http://weaviate:8080
      - REDIS_URL=redis://redis:6379
      - IMAGES_DIR=/app/images
    volumes:
      # Mount images from local dataset folder
      # Set DATASET_PATH env var or place images in ./fashion-images/
      - ${DATASET_PATH:-./fashion-images}:/app/images:ro
      - ./visual-discovery-backend:/app
    depends_on:
      weaviate:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "pip uninstall opencv-python -y || true &&
             pip install opencv-python-headless --no-deps &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  # ── Next.js Frontend ──────────────────────────────────────
  ui:
    build:
      context: ./visual-discovery-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  weaviate_data:
    name: visual-discovery-weaviate-data